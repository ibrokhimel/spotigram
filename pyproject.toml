[project]
name = "spotigram"
version = "0.1.0"
description = "Private Telegram bot that matches Spotify metadata to YouTube/SoundCloud audio."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Spotigram" }]
dependencies = [
    "python-telegram-bot>=21.6,<23",
    "spotipy>=2.24.0",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.4.0",
    "cryptography>=43.0.0",
    "aiohttp>=3.10.0",
    "spotdl>=4.2.0",
    "python-dotenv>=1.0.0",
    "setuptools>=68,<81",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
spotigram = "spotigram.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
