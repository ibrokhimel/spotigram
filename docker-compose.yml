services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_LOCAL: "1"
    volumes:
      - ./data/bot-api:/var/lib/telegram-bot-api
      - ./data:/app/data
    restart: unless-stopped

  bot:
    build: .
    env_file: .env
    environment:
      TELEGRAM_BOT_API_URL: http://telegram-bot-api:8081
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    ports:
      - "8888:8888"
    depends_on:
      - telegram-bot-api
    restart: unless-stopped
